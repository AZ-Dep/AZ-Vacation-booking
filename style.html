<style>
/* ==========================================================================
   AZ Vacation Booking Application - Modern Responsive Glassmorphism CSS
   ========================================================================== */

/* Design Tokens */
:root {
    /* CUSTOMIZABLE IMAGES - Insert Google Drive direct link here */
    --logo-url: url('Logo bafs Original.png');
    --background-url: url('20220221_070326.jpg');

    --primary: #1e88e5;
    --primary-light: #64b5f6;
    --primary-dark: #1565c0;
    --accent: #ff9800;
    --accent-hover: #f57c00;
    --success: #4caf50;
    --success-light: #81c784;
    --success-hover: #388e3c;
    --danger: #f44336;
    --danger-hover: #d32f2f;
    --warning: #ffeb3b;
    --info: #00bcd4;
    --foreman-purple: #9b59b6;
    --foreman-purple-dark: #8e44ad;

    /* Theme Colors - Soft Slate & Steel Blue (Brighter, Modern Slate & Cool Steel Blue) */
    --bg-overlay: rgba(30, 41, 59, 0.75);
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-bg-hover: rgba(255, 255, 255, 0.16);
    --glass-card: rgba(30, 41, 59, 0.78);
    --glass-border: rgba(255, 255, 255, 0.15);
    --glass-border-focus: rgba(56, 189, 248, 0.6);

    /* Text Colors */
    --text-primary: #ffffff;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;

    /* Layout Properties */
    --sidebar-width: 380px;
    --header-height: 80px;
    --border-radius-lg: 16px;
    --border-radius-md: 10px;
    --border-radius-sm: 6px;
    --transition-speed: 0.3s;
    --font-sans: 'Outfit', 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* Base Reset & Configuration */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent; /* Disable tap highlight on mobile */
}

body, html {
    width: 100%;
    height: 100%;
    font-family: var(--font-sans);
    color: var(--text-primary);
    background-color: #1e293b;
    overflow-x: hidden;
    line-height: 1.5;
}

/* Background Image */
.bg-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    background-image: var(--background-url);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.bg-wrapper::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(51, 65, 85, 0.65) 0%, rgba(15, 23, 42, 0.88) 100%);
    z-index: -1;
}

/* Utilities */
.hidden {
    display: none !important;
}

/* Glassmorphic Card */
.glass-card {
    background: var(--glass-card);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: var(--border-radius-lg);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    padding: 24px;
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUp {
    from { opacity: 0; transform: translate(-50%, -40%); }
    to { opacity: 1; transform: translate(-50%, -50%); }
}

@keyframes scaleUp {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

.animate-fade-in {
    animation: fadeIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
}

.animate-slide-up {
    animation: slideUp 0.35s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
}

.animate-scale-up {
    animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

/* Buttons */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 500;
    padding: 12px 24px;
    border-radius: var(--border-radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.25s ease;
    text-decoration: none;
    gap: 8px;
    min-height: 48px; /* Mobile tap target */
}

.btn-block {
    display: flex;
    width: 100%;
}

.btn-primary {
    background-color: var(--primary);
    color: #fff;
    box-shadow: 0 4px 15px rgba(30, 136, 229, 0.35);
}
.btn-primary:hover:not(:disabled) {
    background-color: var(--primary-dark);
    transform: translateY(-2px);
}
.btn-primary:active:not(:disabled) {
    transform: translateY(0);
}

.btn-secondary {
    background-color: rgba(255, 255, 255, 0.08);
    color: var(--text-primary);
    border: 1px solid var(--glass-border);
}
.btn-secondary:hover:not(:disabled) {
    background-color: rgba(255, 255, 255, 0.16);
}

.btn-success {
    background-color: var(--success);
    color: #fff;
    box-shadow: 0 4px 15px rgba(76, 175, 80, 0.35);
}
.btn-success:hover:not(:disabled) {
    background-color: var(--success-hover);
    transform: translateY(-2px);
}
.btn-success:active:not(:disabled) {
    transform: translateY(0);
}

.btn-danger {
    background-color: var(--danger);
    color: #fff;
    box-shadow: 0 4px 15px rgba(244, 67, 54, 0.35);
}
.btn-danger:hover:not(:disabled) {
    background-color: var(--danger-hover);
    transform: translateY(-2px);
}
.btn-danger:active:not(:disabled) {
    transform: translateY(0);
}

.btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
}

.btn-large {
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 600;
}

/* ==========================================================================
   1. LOGIN OVERLAY
   ========================================================================== */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: var(--bg-overlay);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity var(--transition-speed), visibility var(--transition-speed);
    padding: 16px;
}

.overlay.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.login-card {
    width: 440px;
    max-width: 100%;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.15);
}

.login-logo {
    height: 54px;
    margin-bottom: 16px;
    object-fit: contain;
}

.login-header h2 {
    font-size: 20px;
    margin-bottom: 8px;
    font-weight: 600;
}

.login-header p {
    color: var(--text-secondary);
    font-size: 13.5px;
    margin-bottom: 26px;
}

/* Form Controls */
.form-group {
    margin-bottom: 18px;
    text-align: left;
}

.form-group label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
}

.input-wrapper {
    position: relative;
}

.input-wrapper input {
    width: 100%;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--glass-border);
    padding: 12px 16px 12px 42px;
    border-radius: var(--border-radius-md);
    color: #fff;
    font-size: 15px;
    font-family: var(--font-sans);
    transition: all var(--transition-speed) ease;
    min-height: 48px;
}

.input-wrapper input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.2);
    background: rgba(0, 0, 0, 0.45);
}

.input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 18px;
}

.error-text {
    color: #ff5252;
    font-size: 12px;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
}

/* ==========================================================================
   2. MAIN APPLICATION CONTAINER
   ========================================================================== */
.app-layout {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 20px;
    gap: 20px;
    max-width: 1650px;
    margin: 0 auto;
    overflow: hidden;
}

/* HEADER STYLE */
.main-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: var(--header-height);
    padding: 10px 24px;
    flex-shrink: 0;
}

.header-logo-section {
    display: flex;
    align-items: center;
    gap: 16px;
}

.app-logo {
    height: 44px;
    object-fit: contain;
}

.header-title-wrapper h1 {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
}

.header-title-wrapper .sub-title {
    font-size: 11px;
    color: var(--text-muted);
}

.header-controls {
    display: flex;
    align-items: center;
    gap: 20px;
}

/* Mock Date Override widget */
.mock-date-container {
    background: rgba(0, 0, 0, 0.35);
    border: 1px dashed rgba(255, 152, 0, 0.35);
    padding: 8px 12px;
    border-radius: var(--border-radius-md);
    display: flex;
    align-items: center;
    gap: 8px;
}

.mock-date-container label {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--accent);
}

.mock-date-input {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--glass-border);
    border-radius: var(--border-radius-sm);
    color: #fff;
    padding: 4px 8px;
    font-size: 12.5px;
    font-family: var(--font-sans);
    outline: none;
    cursor: pointer;
    min-height: 32px;
}

.mock-date-input:focus {
    border-color: var(--accent);
}

.mock-date-input:disabled {
    cursor: not-allowed;
    opacity: 0.7;
    background: rgba(0, 0, 0, 0.2);
    border-color: rgba(255, 255, 255, 0.1);
}

/* User profile widget */
.user-profile-widget {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.04);
    padding: 6px 12px;
    border-radius: 40px;
    border: 1px solid var(--glass-border);
}

.user-profile-widget .avatar {
    font-size: 16px;
}

.user-profile-widget .user-info {
    display: flex;
    flex-direction: column;
    text-align: left;
}

.user-profile-widget .user-email {
    font-size: 12px;
    font-weight: 500;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.user-profile-widget .user-role {
    font-size: 9px;
    color: var(--text-muted);
}

.btn-logout {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: var(--border-radius-sm);
    transition: color 0.2s, background-color 0.2s;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.btn-logout:hover {
    color: var(--danger);
    background-color: rgba(244, 67, 54, 0.1);
}

/* MAIN CONTENT LAYOUT */
.main-content {
    display: flex;
    flex: 1;
    gap: 20px;
    min-height: 0;
}

/* SIDEBAR SECTION */
.sidebar-section {
    width: var(--sidebar-width);
    display: flex;
    flex-direction: column;
    gap: 20px;
    flex-shrink: 0;
    overflow-y: auto;
}

/* Rules Card */
.rules-card h3, .booking-form-card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--glass-border);
    padding-bottom: 6px;
}

.rules-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.rules-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
}

.rule-num {
    background: rgba(30, 136, 229, 0.15);
    border: 1px solid var(--primary);
    color: var(--primary-light);
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 2px;
}

.rules-list p {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.35;
}

/* Form inputs styling */
.form-select {
    width: 100%;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--glass-border);
    color: #fff;
    padding: 10px 14px;
    border-radius: var(--border-radius-md);
    font-size: 14px;
    font-family: var(--font-sans);
    outline: none;
    transition: border-color var(--transition-speed), box-shadow var(--transition-speed);
    cursor: pointer;
    min-height: 44px; /* Touch target */
}

.form-select option {
    background-color: #0d162a;
    color: #fff;
}

.form-select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.2);
}

.form-select:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

.date-selection-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

/* ==========================================================================
   MAIN CALENDAR DASHBOARD
   ========================================================================== */
.calendar-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

/* Placeholder card when no team selected */
.placeholder-card {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.placeholder-content {
    max-width: 420px;
}

.placeholder-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.6;
}

.placeholder-content h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
}

.placeholder-content p {
    font-size: 13.5px;
    color: var(--text-muted);
}

/* Calendar wrapper active state */
.calendar-content-wrapper {
    height: 100%;
    display: flex;
    flex-direction: column;
}

.calendar-card {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 20px;
    overflow-y: auto;
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
    gap: 20px;
    flex-shrink: 0;
}

.calendar-info h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
}

.legend {
    display: flex;
    gap: 12px;
    background: rgba(0, 0, 0, 0.2);
    padding: 8px 14px;
    border-radius: 30px;
    border: 1px solid var(--glass-border);
    flex-wrap: wrap;
    justify-content: center;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-secondary);
}

.legend-box {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    border: 1px solid rgba(255, 255, 255, 0.15);
}

.legend-box.available { background-color: rgba(255, 255, 255, 0.04); }
.legend-box.booked-foreman { background-color: var(--foreman-purple); border-color: #d7bde2; }
.legend-box.booked-c { background-color: rgba(30, 136, 229, 0.85); border-color: #90caf9; }
.legend-box.booked-f { background-color: rgba(76, 175, 80, 0.85); border-color: #a5d6a7; }
.legend-box.selected { background-color: rgba(255, 152, 0, 0.25); border: 1.5px solid var(--accent); }

/* VERTICAL SLOTS STYLE */
.slots-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 10px;
}

.slot-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--glass-border);
    border-radius: var(--border-radius-md);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.25s ease;
    user-select: none;
    position: relative;
    overflow: hidden;
}

.slot-card-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: left;
}

.slot-card-date {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
}

.slot-card-year {
    font-size: 11px;
    color: var(--text-muted);
}

.slot-card-right-zones {
    display: flex;
    gap: 12px;
    flex-shrink: 0;
}

.concourse-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    border-radius: var(--border-radius-md);
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--glass-border);
    min-width: 130px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.concourse-zone:hover:not(.disabled) {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--primary-light);
    transform: translateY(-1.5px);
}

.concourse-zone.selected-zone {
    background: rgba(255, 152, 0, 0.12) !important;
    border: 2px solid var(--accent) !important;
    box-shadow: 0 4px 15px rgba(255, 152, 0, 0.2);
}

.concourse-zone.disabled {
    opacity: 0.45;
    cursor: not-allowed;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 4px, transparent 4px, transparent 8px);
}

.concourse-zone .zone-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
}

.concourse-zone .zone-value {
    font-size: 13px;
    font-weight: 600;
}

.concourse-zone.available .zone-value {
    color: var(--success-light);
}

.concourse-zone.booked-c .zone-value {
    color: #90caf9;
}

.concourse-zone.booked-f .zone-value {
    color: #a5d6a7;
}

.concourse-zone.c-zone {
    border-color: rgba(30, 136, 229, 0.3);
}

.concourse-zone.f-zone {
    border-color: rgba(76, 175, 80, 0.3);
}

.concourse-zone.disabled-zone .zone-value {
    color: #e57373;
}

/* Profile card grid */
.profile-details-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.profile-field {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    border-bottom: 1px dashed rgba(255,255,255,0.05);
    padding-bottom: 6px;
}

.profile-field:last-child {
    border-bottom: none;
    padding-bottom: 0;
}

.p-label {
    color: var(--text-muted);
}

.p-val {
    font-weight: 600;
    color: #fff;
}

/* Loading Spinner */
.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Spacer */
.spacer-x {
    height: 1px;
}

.slot-cell.booked-slot-foreman:hover,
.slot-cell.booked-slot-c:hover,
.slot-cell.booked-slot-f:hover {
    filter: brightness(1.15);
}

/* Blocked calendar slots */
.slot-cell.disabled {
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 4px, transparent 4px, transparent 8px);
    opacity: 0.4;
    cursor: not-allowed;
}

.slot-content-wrapper {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    width: 100%;
    overflow: hidden;
}

.slot-name {
    font-size: 11px;
    font-weight: 500;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.slot-tag {
    font-size: 8px;
    opacity: 0.7;
    margin-top: 1px;
}

/* Bottom Action Bar */
.calendar-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0, 0, 0, 0.3);
    padding: 14px 20px;
    border-radius: var(--border-radius-md);
    border: 1px solid var(--glass-border);
    flex-shrink: 0;
    gap: 16px;
    margin-top: 10px;
}

.selected-summary {
    font-size: 13.5px;
    color: var(--text-secondary);
    text-align: left;
}

.selected-summary strong {
    color: var(--accent);
}

/* ==========================================================================
   MODAL WINDOWS & DIALOGS
   ========================================================================== */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(5, 10, 20, 0.85);
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1100;
    padding: 16px;
}

.modal-card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 460px;
    max-width: 95%;
    border: 1px solid rgba(255, 255, 255, 0.15);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--glass-border);
    padding-bottom: 10px;
}

.modal-header h3 {
    font-size: 16px;
    font-weight: 600;
}

.btn-close-modal {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 24px;
    cursor: pointer;
    padding: 0 4px;
}

.confirm-info-list {
    background: rgba(0, 0, 0, 0.2);
    border-radius: var(--border-radius-md);
    padding: 14px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 1px solid var(--glass-border);
